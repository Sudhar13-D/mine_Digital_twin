services:
  # ============================================================================
  # 1. FastAPI Backend API Service
  # ============================================================================
  - type: web
    name: subsideai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: subsideai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MQTT_BROKER_HOST
        value: broker.hivemq.com
      - key: MQTT_BROKER_PORT
        value: "1883"

  # ============================================================================
  # 2. React + Vite Frontend Static Site
  # ============================================================================
  - type: web
    name: subsideai-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # After deployment, add VITE_API_URL in Render Dashboard:
    # Key: VITE_API_URL, Value: https://subsideai-backend.onrender.com

# ============================================================================
# 3. PostgreSQL Database
# ============================================================================
databases:
  - name: subsideai-db
    region: oregon
    plan: free
    databaseName: subsideai
    user: subsideai_user
